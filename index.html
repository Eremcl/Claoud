/* ===================== KILIÇ YOLU (OYUN) ===================== */
/* Kahraman kendiliğinden yürür. Canavar yaklaşınca soru gelir: doğru cevap kılıç darbesi, yanlış cevap can kaybı. */
const G = {
  durum: "menu", ders: "hepsi", meb: false,
  can: 3, puan: 0, kombo: 0, enKombo: 0, olu: 0, d: 0, y: 0, altin: 0, bolum: 1,
  kuyruk: [], soru: null, sure: 0, sureMax: 0, geri: null, oto: 0,
  canavar: null, mesafe: 0, sonraki: 360, sonrakiPara: 200, hiz: 150, kamera: 0,
  hero: { y: 0, vy: 0, kilic: 0, vurdu: false, hasar: 0, adim: 0 },
  paralar: [], parca: [], yazilar: [], sallan: 0,
  cv: null, ctx: null, w: 0, h: 0, raf: 0, son: 0, sesAcik: true, actx: null,
};
const G_RENK = { tr: "#ec7a4f", mat: "#5b86f2", fen: "#27b8aa", ink: "#c08a52", din: "#93b84e", ing: "#a072e6" };
const G_AD = { tr: "Yazım Goblini", mat: "Kök Golemi", fen: "Asit Balçığı", ink: "Mondros Hayaleti", din: "Unutkanlık Gölgesi", ing: "Grammar Yarasası" };
const G_GOK = [["#2a1d4f", "#e68a62"], ["#0f3550", "#75c3a6"], ["#3a1a2e", "#f0a858"], ["#121d38", "#7290db"]];
const gZemin = () => G.h - 46;
const gHeroX = () => Math.max(64, G.w * 0.2);

function gHavuz() { return Q.filter(q => (G.ders === "hepsi" || q.s === G.ders) && (!G.meb || q.k)); }
function gSoruAl() {
  if (!G.kuyruk.length) G.kuyruk = karistir(gHavuz());
  return G.kuyruk.pop();
}
function ses(f1, f2, sure, tip = "square", vol = 0.12, gecikme = 0) {
  if (!G.sesAcik || !G.actx) return;
  try {
    const t = G.actx.currentTime + gecikme, o = G.actx.createOscillator(), g = G.actx.createGain();
    o.type = tip; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + sure);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + sure);
    o.connect(g); g.connect(G.actx.destination); o.start(t); o.stop(t + sure + 0.02);
  } catch (e) {}
}

function oyunBasla() {
  try { if (!G.actx) G.actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  Object.assign(G, { durum: "walk", can: 3, puan: 0, kombo: 0, enKombo: 0, olu: 0, d: 0, y: 0, altin: 0, bolum: 1,
    kuyruk: karistir(gHavuz()), soru: null, geri: null, canavar: null, mesafe: 0, sonraki: 360, sonrakiPara: 160, hiz: 150,
    paralar: [], parca: [], yazilar: [], sallan: 0 });
  G.hero = { y: gZemin(), vy: 0, kilic: 0, vurdu: false, hasar: 0, adim: 0 };
  gHud(); gPanel();
}
function zipla() {
  if (G.durum !== "walk" || G.hero.y < gZemin() - 1) return;
  G.hero.vy = -560; ses(300, 600, 0.12, "triangle", 0.08);
}
function duelBasla() {
  const c = G.canavar;
  if (!c.q) c.q = gSoruAl();
  G.soru = c.q; G.durum = "duel"; G.geri = null;
  const uz = G.soru.q.length + G.soru.o.join("").length;
  G.sureMax = G.sure = Math.round(Math.min(120, Math.max(25, 18 + uz / 12)));
  gPanel();
  const p = $("#g-panel"); if (p && p.getBoundingClientRect().top > window.innerHeight - 120) p.scrollIntoView({ behavior: "smooth", block: "start" });
}
function gCevap(j) {
  if (G.durum !== "duel") return;
  const q = G.soru, c = G.canavar, dogru = j === q.a;
  kaydetCevap(q, j);
  let kazanc = 0;
  if (dogru) {
    G.d++; G.kombo++; G.enKombo = Math.max(G.enKombo, G.kombo);
    kazanc = Math.round(100 * (1 + 0.25 * (G.kombo - 1)) * (c.boss ? 2 : 1));
    G.puan += kazanc;
    G.hero.kilic = 0.001; G.hero.vurdu = false;
    ses(900, 180, 0.16, "sawtooth", 0.09);
    G.oto = c.boss && c.hp > 1 ? 1.3 : 1.1;
  } else {
    G.y++; G.kombo = 0; G.can--;
    c.saldiri = 0.001; G.hero.hasar = 0.7; G.sallan = 0.35;
    gYazi(gHeroX(), G.hero.y - 70, "−1 ♥", "#ff6b6b");
    ses(180, 50, 0.3, "square", 0.14);
    G.oto = 0;
  }
  G.geri = { dogru, j, kazanc };
  G.durum = "sonuc";
  gHud(); gPanel();
}
function gDevam() {
  if (G.durum !== "sonuc") return;
  const c = G.canavar;
  if (G.can <= 0) return gBitir();
  if (c && c.hp > 0 && c.boss) { c.q = null; return duelBasla(); }
  if (c && c.hp > 0) c.kac = true;          // yanlış cevapta canavar kaçar
  G.durum = "walk"; G.soru = null; G.geri = null;
  G.sonraki = G.mesafe + 480 + Math.random() * 360;
  gPanel();
}
function gVur() {
  const c = G.canavar; if (!c) return;
  c.hp--; c.vuruldu = 0.25;
  gPatla(c.x, gZemin() - 30 * c.olcek, G_RENK[c.s], 14);
  if (c.hp <= 0) {
    c.olum = 0.001; G.olu++; S.oyun.olu = (S.oyun.olu || 0) + 1;
    gPatla(c.x, gZemin() - 30 * c.olcek, G_RENK[c.s], c.boss ? 50 : 26);
    gYazi(c.x, gZemin() - 90 * c.olcek, "+" + G.geri.kazanc, "#ffd166");
    if (G.kombo >= 3) gYazi(c.x, gZemin() - 120 * c.olcek, "Kombo x" + G.kombo + "!", "#fff");
    if (c.boss) {
      G.bolum++; G.hiz += 18; G.can = Math.min(5, G.can + 1);
      gYazi(gHeroX(), G.hero.y - 100, "Bölüm " + G.bolum + "  +1 ♥", "#9ef0b4");
      [523, 659, 784, 1047].forEach((f, i) => ses(f, f, 0.18, "triangle", 0.1, i * 0.11));
    } else ses(220, 90, 0.25, "square", 0.08);
    kaydet(); gHud();
  } else gYazi(c.x, gZemin() - 110, "+" + G.geri.kazanc, "#ffd166");
}
function gBitir() {
  G.durum = "over";
  if (G.puan > (S.oyun.rekor || 0)) { S.oyun.rekor = G.puan; G.yeniRekor = true; } else G.yeniRekor = false;
  kaydet(); gHud(); gPanel();
}
function gPatla(x, y, renk, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 260;
    G.parca.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, t: 0, max: 0.5 + Math.random() * 0.5, r: 2 + Math.random() * 4, renk: Math.random() < 0.3 ? "#fff" : renk });
  }
}
function gYazi(x, y, metin, renk) { G.yazilar.push({ x, y, metin, renk, t: 0 }); }

/* ---- döngü ---- */
function gDongu(t) {
  const dt = Math.min(0.05, (t - (G.son || t)) / 1000); G.son = t;
  gGuncelle(dt); gCiz();
  G.raf = requestAnimationFrame(gDongu);
}
function gGuncelle(dt) {
  const h = G.hero, zem = gZemin(), hx = gHeroX();
  const yuru = G.durum === "walk" || G.durum === "menu";
  const hiz = G.durum === "menu" ? 60 : G.hiz;
  if (yuru) { G.kamera += hiz * dt; h.adim += dt * hiz / 14; }
  // zıplama
  h.vy += 1500 * dt; h.y = Math.min(zem, h.y + h.vy * dt); if (h.y >= zem) h.vy = 0;
  if (h.kilic > 0) {
    h.kilic += dt / 0.32;
    if (!h.vurdu && h.kilic > 0.45) { h.vurdu = true; gVur(); }
    if (h.kilic >= 1) h.kilic = 0;
  }
  if (h.hasar > 0) h.hasar -= dt;
  if (G.sallan > 0) G.sallan -= dt;

  if (G.durum === "walk") {
    G.mesafe += hiz * dt;
    if (!G.canavar && G.mesafe >= G.sonraki) {
      const boss = (G.olu + 1) % 8 === 0;
      const q = gSoruAl();
      G.canavar = { x: G.w + 50, s: q.s, q, boss, hp: boss ? 3 : 1, maxHp: boss ? 3 : 1, olcek: boss ? 1.7 : 1, faz: Math.random() * 6 };
    }
    if (G.mesafe >= G.sonrakiPara) {
      G.sonrakiPara = G.mesafe + 140 + Math.random() * 220;
      const yuksek = Math.random() < 0.55;
      const n = 1 + Math.floor(Math.random() * 3);
      for (let i = 0; i < n; i++) G.paralar.push({ x: G.w + 30 + i * 30, y: zem - (yuksek ? 118 : 30), f: Math.random() * 6 });
    }
    G.paralar.forEach(p => { p.x -= hiz * dt; });
  }
  // paralar
  G.paralar = G.paralar.filter(p => {
    p.f += dt * 6;
    if (Math.abs(p.x - hx) < 22 && p.y > h.y - 64 && p.y < h.y + 6) {
      G.altin++; G.puan += 10; ses(1200, 1800, 0.07, "triangle", 0.07); gPatla(p.x, p.y, "#ffd166", 5); gHud(); return false;
    }
    return p.x > -20;
  });
  // canavar
  const c = G.canavar;
  if (c) {
    c.faz += dt * 5;
    if (c.vuruldu > 0) c.vuruldu -= dt;
    if (c.saldiri > 0) { c.saldiri += dt / 0.45; if (c.saldiri >= 1) c.saldiri = 0; }
    if (c.olum > 0) { c.olum += dt / 0.5; if (c.olum >= 1) G.canavar = null; }
    else if (c.kac) { c.x += 320 * dt; if (c.x > G.w + 80) G.canavar = null; }
    else if (G.durum === "walk") {
      c.x -= (hiz + 45) * dt;
      if (c.x - hx < 70 + 40 * c.olcek) duelBasla();
    }
  }
  // efektler
  G.parca = G.parca.filter(p => { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 700 * dt; return p.t < p.max; });
  G.yazilar = G.yazilar.filter(y => { y.t += dt; y.y -= 40 * dt; return y.t < 1.2; });
  // süre
  if (G.durum === "duel") {
    G.sure -= dt;
    const b = $("#g-tbar"); if (b) { b.style.width = Math.max(0, G.sure / G.sureMax * 100) + "%"; b.style.background = G.sure < 8 ? "var(--bad)" : ""; }
    const sn = $("#g-sn"); if (sn) sn.textContent = Math.max(0, Math.ceil(G.sure)) + " sn";
    if (G.sure <= 0) gCevap(-1);
  }
  if (G.durum === "sonuc" && G.oto > 0) { G.oto -= dt; if (G.oto <= 0) gDevam(); }
}

/* ---- çizim ---- */
function gCiz() {
  const x = G.ctx; if (!x) return;
  const W = G.w, H = G.h, zem = gZemin(), k = G.kamera;
  x.save();
  if (G.sallan > 0) x.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 6);
  // gökyüzü
  const gk = G_GOK[(G.bolum - 1) % G_GOK.length];
  const gr = x.createLinearGradient(0, 0, 0, zem); gr.addColorStop(0, gk[0]); gr.addColorStop(1, gk[1]);
  x.fillStyle = gr; x.fillRect(-10, -10, W + 20, zem + 10);
  x.fillStyle = "rgba(255,240,200,.85)"; x.beginPath(); x.arc(W * 0.78, zem * 0.3, 22, 0, 7); x.fill();
  // dağlar ve tepeler
  gKatman(x, k * 0.12, zem - 40, 70, "rgba(20,10,40,.35)", 0.006, 0.013);
  gKatman(x, k * 0.35, zem - 8, 42, "rgba(20,10,40,.5)", 0.011, 0.023);
  // zemin
  x.fillStyle = "#3a2c2a"; x.fillRect(-10, zem, W + 20, H - zem + 10);
  x.fillStyle = "#5c9a3f"; x.fillRect(-10, zem, W + 20, 8);
  x.fillStyle = "rgba(0,0,0,.18)";
  for (let i = -(k % 36); i < W; i += 36) x.fillRect(i, zem + 14, 18, 5);
  // çitler
  x.fillStyle = "rgba(30,18,20,.45)";
  for (let i = -(k * 0.8 % 120); i < W + 20; i += 120) { x.fillRect(i, zem - 26, 5, 26); x.fillRect(i - 20, zem - 20, 45, 4); }
  // paralar
  G.paralar.forEach(p => {
    const s = Math.abs(Math.cos(p.f)) * 8 + 2;
    x.fillStyle = "#ffd166"; x.beginPath(); x.ellipse(p.x, p.y, s, 9, 0, 0, 7); x.fill();
    x.fillStyle = "#fff6"; x.fillRect(p.x - 1, p.y - 5, 2, 5);
  });
  if (G.canavar) gCanavar(x, G.canavar);
  gKahraman(x, gHeroX(), G.hero.y);
  // parçacıklar ve yazılar
  G.parca.forEach(p => { x.globalAlpha = 1 - p.t / p.max; x.fillStyle = p.renk; x.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r); });
  x.globalAlpha = 1;
  x.textAlign = "center"; x.font = '800 18px "Bricolage Grotesque", system-ui, sans-serif';
  G.yazilar.forEach(y => { x.globalAlpha = Math.max(0, 1 - y.t / 1.2); x.fillStyle = "#0008"; x.fillText(y.metin, y.x + 1, y.y + 2); x.fillStyle = y.renk; x.fillText(y.metin, y.x, y.y); });
  x.globalAlpha = 1;
  if (G.durum === "menu" || G.durum === "over") {
    x.fillStyle = "rgba(10,6,25,.45)"; x.fillRect(0, 0, W, H);
    x.fillStyle = "#fff"; x.font = '800 ' + Math.round(Math.min(44, W / 11)) + 'px "Bricolage Grotesque", system-ui, sans-serif';
    x.fillText(G.durum === "menu" ? "KILIÇ YOLU" : "OYUN BİTTİ", W / 2, H * 0.4);
    x.font = '500 15px "Lexend", system-ui, sans-serif'; x.fillStyle = "#ffe2ea";
    x.fillText(G.durum === "menu" ? "Soruları doğru cevapla, canavarları kılıçla!" : `${G.puan} puan · ${G.olu} canavar`, W / 2, H * 0.4 + 30);
  }
  if (G.durum === "duel") {
    x.fillStyle = "rgba(10,6,25,.25)"; x.fillRect(0, 0, W, H);
    x.fillStyle = "#fff"; x.font = '800 20px "Bricolage Grotesque", system-ui, sans-serif';
    x.fillText("Soruyu cevapla, kılıcını savur!", W / 2, 34);
  }
  x.restore();
}
function gKatman(x, ofs, taban, yuk, renk, f1, f2) {
  x.fillStyle = renk; x.beginPath(); x.moveTo(-10, taban + 10);

    const u = i + ofs;

  }

}
function gKahraman(x, hx, y) {
  const h = G.hero, yuru = (G.durum === "walk" || G.durum === "menu") && y >= gZemin() - 1;
  const ad = yuru ? Math.sin(h.adim) : 0;
  if (h.hasar > 0 && Math.floor(h.hasar * 20) % 2 === 0) return;
  x.save(); x.translate(hx, y);
  // gölge

  // gövde (zırh)

  x.fillStyle = "#9aa6b6"; x.fillRect(-10, -24, 20, 4);
  x.fillStyle = "#c43a5c"; x.fillRect(-3, -38, 6, 12);
  // kask
  x.fillStyle = "#aeb9c7"; x.fillRect(-9, -60, 18, 18);
  x.fillStyle = "#1c2230"; x.fillRect(0, -54, 9, 3);
  x.fillStyle = "#c43a5c"; x.fillRect(-4, -66, 4, 7); x.fillRect(-8, -68, 8, 3);
  // kılıç

function gCanavar(x, c) {
  const zem = gZemin(), s = c.olcek, renk = G_RENK[c.s];
  let cx = c.x;

  x.fillStyle = "rgba(0,0,0,.25)"; x.beginPath(); x.ellipse(0, 2 + zipla / s, 22, 4, 0, 0, 7); x.fill();
  // gövde
  x.fillStyle = c.vuruldu > 0 ? "#fff" : renk;
  x.beginPath(); x.moveTo(-24, 0); x.quadraticCurveTo(-26, -40, 0, -44); x.quadraticCurveTo(26, -40, 24, 0); x.closePath(); x.fill();
  x.fillStyle = "rgba(0,0,0,.15)"; x.beginPath(); x.ellipse(4, -8, 16, 6, 0, 0, 7); x.fill();
  // boynuzlar (patron)
  if (c.boss) {
    x.fillStyle = "#f1e3c6";
    x.beginPath(); x.moveTo(-16, -36); x.lineTo(-24, -56); x.lineTo(-8, -40); x.fill();
    x.beginPath(); x.moveTo(16, -36); x.lineTo(24, -56); x.lineTo(8, -40); x.fill();
  }
  // gözler sola (kahramana) bakar
  x.fillStyle = "#fff"; x.beginPath(); x.arc(-10, -26, 6, 0, 7); x.arc(4, -26, 6, 0, 7); x.fill();
  x.fillStyle = "#1b1430"; x.beginPath(); x.arc(-12, -25, 3, 0, 7); x.arc(2, -25, 3, 0, 7); x.fill();
  x.fillStyle = "#1b1430"; x.fillRect(-12, -14, 16, 4);
  x.fillStyle = "#fff"; x.fillRect(-10, -14, 3, 3); x.fillRect(-3, -14, 3, 3);
  x.restore();
  if (c.olum > 0) return;
  // isim ve can
  x.textAlign = "center"; x.font = '600 12px "Lexend", system-ui, sans-serif';
  const ust = zem - 50 * s - 14;
  const ad = c.boss ? "Sınav Canavarı" : G_AD[c.s];
  x.fillStyle = "#0009"; x.fillText(ad, cx + 1, ust + 1); x.fillStyle = "#fff"; x.fillText(ad, cx, ust);
  if (c.boss) {
    const bw = 70; x.fillStyle = "#0007"; x.fillRect(cx - bw / 2, ust + 6, bw, 7);
    x.fillStyle = "#ff5c7a"; x.fillRect(cx - bw / 2, ust + 6, bw * c.hp / c.maxHp, 7);
  }
}

/* ---- arayüz ---- */
function vOyun() {
  return `
  <section class="card game">
    <div class="hud" id="g-hud"></div>
    <div class="stage"><canvas id="g-cv" aria-label="Kılıç Yolu oyun alanı. Zıplamak için dokun."></canvas></div>
    <div class="gpanel" id="g-panel"></div>
  </section>`;
}
function gHud() {
  const el = $("#g-hud"); if (!el) return;
  const kalp = "♥".repeat(Math.max(0, G.can)) + "♡".repeat(Math.max(0, 3 - G.can));
  el.innerHTML = `
    <span class="hearts" aria-label="${G.can} can">${kalp}</span>
    <span>Puan <b class="mono">${G.puan}</b></span>
    <span>Kombo <b class="mono">x${G.kombo}</b></span>
    <span>Bölüm <b class="mono">${G.bolum}</b></span>
    <span class="note">Rekor <span class="mono">${S.oyun.rekor || 0}</span></span>
    <button class="btn ghost small sp" data-act="g-ses" aria-pressed="${G.sesAcik}">${G.sesAcik ? "Ses açık" : "Ses kapalı"}</button>`;
}
function gPanel() {
  const el = $("#g-panel"); if (!el) return;
  if (G.durum === "menu") {
    const n = gHavuz().length;
    el.innerHTML = `
      <div class="stack" style="gap:14px">
        <div><h2>Kılıç Yolu</h2><p class="muted" style="margin:4px 0 0">Şövalyen yolda yürüyor. Karşısına çıkan her canavar bir LGS sorusu taşıyor: doğru cevap verirsen kılıcınla vurursun, yanlış cevapta 1 can kaybedersin. Her 8 canavarda bir <b>Sınav Canavarı</b> gelir; onu yenmek için 3 soru bilmen gerekir.</p></div>
        <div class="field"><span class="label">Ders</span>
          <div class="pick">
            <button data-act="g-ders" data-v="hepsi" aria-pressed="${G.ders === "hepsi"}">Karışık</button>
            ${DK.map(s => `<button data-act="g-ders" data-v="${s}" aria-pressed="${G.ders === s}">${esc(DERS[s].ad)}</button>`).join("")}
          </div>
        </div>
        <label class="row" style="gap:8px"><input type="checkbox" id="g-meb" ${G.meb ? "checked" : ""}> Yalnızca MEB'in 2026 LGS soruları</label>
        <div class="row" style="justify-content:space-between">
          <span class="note">${n} soru · Zıplamak için ekrana dokun ya da Boşluk'a bas, altınları topla. Cevaplar için A/B/C/D tuşları da çalışır.</span>
          <button class="btn accent" data-act="g-basla" ${n ? "" : "disabled"}>Yola çık</button>
        </div>
      </div>`;
  } else if (G.durum === "walk") {
    el.innerHTML = `<div class="row" style="justify-content:space-between"><span class="note">Yürüyorsun… Canavar yaklaşınca soru burada açılacak. Zıplamak için ekrana dokun.</span><button class="btn ghost small" data-act="g-menu">Oyunu bitir</button></div>`;
  } else if (G.durum === "duel" || G.durum === "sonuc") {
    const q = G.soru, g = G.geri, c = G.canavar;
    const sinif = j => !g ? "" : j === q.a ? "ok" : j === g.j ? "no" : "";
    el.innerHTML = `
      <div class="duel">
        <div class="duel-head">${chip(q.s)}<span class="note">${esc(q.t)}</span>${kaynak(q)}<span class="sp mono note" id="g-sn">${g ? "" : Math.ceil(G.sure) + " sn"}</span></div>
        ${g ? "" : `<div class="tbar"><i id="g-tbar"></i></div>`}
        ${c && c.boss ? `<div class="note" style="margin-bottom:8px">Sınav Canavarı · ${c.hp} / ${c.maxHp} can</div>` : ""}
        <p class="qtext">${esc(q.q)}</p>
        <div class="opts">${q.o.map((o, j) => `<button class="opt ${sinif(j)}" data-act="g-cev" data-j="${j}" ${g ? "disabled" : ""}><span class="bub">${HARF[j]}</span><span>${esc(o)}</span></button>`).join("")}</div>
        ${g ? `<div class="explain ${g.dogru ? "" : "no"}"><b>${g.dogru ? `Doğru! +${g.kazanc} puan.` : g.j < 0 ? "Süre doldu, canavar vurdu!" : "Yanlış, canavar vurdu!"}</b> Doğru cevap ${HARF[q.a]}. ${esc(q.e)}</div>
          <div class="qfoot"><span class="note">${g.dogru ? "Devam ediliyor…" : G.can <= 0 ? "Canın kalmadı." : "Açıklamayı okuyup devam et."}</span><button class="btn" data-act="g-devam">${G.can <= 0 ? "Sonucu gör" : "Devam et"}</button></div>` : ""}
      </div>`;
  } else if (G.durum === "over") {
    const oran = G.d + G.y ? Math.round(G.d / (G.d + G.y) * 100) : 0;
    el.innerHTML = `
      <div class="stack" style="gap:16px">
        <div><span class="label">${G.yeniRekor ? "Yeni rekor!" : "Macera bitti"}</span><h2>${G.puan} puan · ${G.olu} canavar yenildi</h2></div>
        <div class="hero-res">
          <div><span class="label">Doğru</span><span class="big" style="color:var(--good)">${G.d}</span></div>
          <div><span class="label">Yanlış</span><span class="big" style="color:var(--bad)">${G.y}</span></div>
          <div><span class="label">En uzun kombo</span><span class="big">${G.enKombo}</span></div>
          <div><span class="label">Altın</span><span class="big">${G.altin}</span></div>
          <div><span class="label">Bölüm</span><span class="big">${G.bolum}</span></div>
        </div>
        <p class="note" style="margin:0">Doğru oranın %${oran}. Yanlış yaptığın sorular Yanlışlarım listesine eklendi.</p>
        <div class="row"><button class="btn accent" data-act="g-basla">Tekrar oyna</button><button class="btn ghost" data-act="g-menu">Ders değiştir</button><button class="btn ghost" data-tab="yanlis">Yanlışlarıma git</button></div>
      </div>`;
  }
}
function oyunBagla() {
  const cv = $("#g-cv"); if (!cv) return;
  G.cv = cv; G.ctx = cv.getContext("2d");
  gBoyut(); gHud(); gPanel();
  if (!G.raf) { G.son = 0; G.raf = requestAnimationFrame(gDongu); }
}
function oyunDurdur() { if (G.raf) cancelAnimationFrame(G.raf); G.raf = 0; }
function gBoyut() {
  if (!G.cv) return;
  const w = G.cv.parentElement.clientWidth, h = Math.round(Math.min(340, Math.max(230, w * 0.42)));
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  G.cv.width = w * dpr; G.cv.height = h * dpr; G.cv.style.height = h + "px";
  G.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  G.w = w; G.h = h;
  if (!G.hero.y || G.hero.y > gZemin()) G.hero.y = gZemin();
}
window.addEventListener("resize", () => { if (aktif === "oyun") gBoyut(); });
document.addEventListener("pointerdown", e => { if (e.target.id === "g-cv") zipla(); });

/* ===================== OLAYLAR ===================== */
document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { git(tab.dataset.tab); return; }
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const a = b.dataset.act;

  if (a === "c-ders") { C.ders = b.dataset.v; C.konu = "hepsi"; ciz(); }
  else if (a === "c-basla") {
    let l = karistir(havuz()); if (C.adet) l = l.slice(0, C.adet);
    pratikBasla(l, C.ders === "hepsi" ? "Karışık test" : DERS[C.ders].ad + (C.konu !== "hepsi" ? " · " + C.konu : ""));
  }
  else if (a === "konu-coz") {
    const l = karistir(Q.filter(q => q.s === b.dataset.s && q.t === b.dataset.t));
    pratikBasla(l, DERS[b.dataset.s].ad + " · " + b.dataset.t);
  }
  else if (a === "p-sec") {
    if (Z.cev[Z.i] !== undefined) return;
    const j = +b.dataset.j; Z.cev[Z.i] = j; kaydetCevap(Z.liste[Z.i], j); ciz();
  }
  else if (a === "p-ileri") { Z.i++; ciz(); window.scrollTo({ top: 0 }); }
  else if (a === "p-bitir") { Z.i = Z.liste.length; Z.liste = Z.liste.slice(0, Z.cev.length); ciz(); }
  else if (a === "p-yeni") { Z = null; ciz(); }
  else if (a === "p-tekrar") {
    const l = Z.liste.filter((q, i) => Z.cev[i] >= 0 && Z.cev[i] !== q.a);
    pratikBasla(karistir(l), "Yanlışları tekrar");
  }
  else if (a === "y-coz") {
    const l = S.yanlis.map(id => QMAP[id]).filter(q => q && (!b.dataset.s || q.s === b.dataset.s));
    pratikBasla(karistir(l), "Yanlışlarım tekrarı");
  }
  else if (a === "d-basla") { denemeKur(); ciz(); }
  else if (a === "d-sec") { const j = +b.dataset.j; D.cev[D.i] = D.cev[D.i] === j ? -1 : j; ciz(); }
  else if (a === "d-git") { const i = +b.dataset.i; if (i >= 0 && i < D.liste.length) { D.i = i; D.onay = false; ciz(); } }
  else if (a === "d-bitir") { D.onay = true; ciz(); }
  else if (a === "d-bitir-hayir") { D.onay = false; ciz(); }
  else if (a === "d-bitir-evet") { denemeBitir(); window.scrollTo({ top: 0 }); }
  else if (a === "d-yeni") { D = null; ciz(); }
  else if (a === "pomo-bas") {
    try { if (!P.ctx) P.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {}
    P.calisiyor = !P.calisiyor;
    clearInterval(P.int);
    if (P.calisiyor) P.int = setInterval(pomoTik, 1000);
    pomoGuncelle();
  }
  else if (a === "g-ders") { G.ders = b.dataset.v; gPanel(); }
  else if (a === "g-basla") oyunBasla();
  else if (a === "g-cev") gCevap(+b.dataset.j);
  else if (a === "g-devam") gDevam();
  else if (a === "g-menu") { G.durum = "menu"; G.canavar = null; G.soru = null; gHud(); gPanel(); }
  else if (a === "g-ses") { G.sesAcik = !G.sesAcik; gHud(); }
  else if (a === "pomo-sifir") { clearInterval(P.int); P.calisiyor = false; P.mod = "calis"; P.kalan = POMO_SURE.calis; pomoGuncelle(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "c-konu") { C.konu = t.value; ciz(); }
  else if (t.id === "c-adet") { C.adet = +t.value; }
  else if (t.id === "c-yeni") { C.yeni = t.checked; ciz(); }
  else if (t.id === "c-meb") { C.meb = t.checked; ciz(); }
  else if (t.id === "g-meb") { G.meb = t.checked; }
  else if (t.id === "hedef") { const v = Math.max(5, Math.min(300, +t.value || 40)); S.hedef = v; kaydet(); ciz(); }
  else if (t.id === "sinav" && t.value) { S.sinav = t.value; kaydet(); ust(); }
  else if (t.dataset.konu) { if (t.checked) S.konu[t.dataset.konu] = true; else delete S.konu[t.dataset.konu]; kaydet(); ciz(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.net) { N[t.dataset.net][t.dataset.k] = Math.max(0, +t.value || 0); netGuncelle(); }
});
document.addEventListener("keydown", e => {
  if (e.target.matches("input, select, textarea")) return;
  const k = e.key.toUpperCase();
  const idx = HARF.indexOf(k);
  if (aktif === "oyun") {
    if (e.key === " " && G.durum === "walk") { e.preventDefault(); zipla(); }
    else if (idx >= 0 && G.durum === "duel") gCevap(idx);
    else if (e.key === "Enter" && G.durum === "sonuc") gDevam();
    return;
  }
  if (aktif === "coz" && Z && Z.i < Z.liste.length) {
    if (idx >= 0 && Z.cev[Z.i] === undefined) { Z.cev[Z.i] = idx; kaydetCevap(Z.liste[Z.i], idx); ciz(); }
    else if (e.key === "Enter" && Z.cev[Z.i] !== undefined) { Z.i++; ciz(); }
  } else if (aktif === "deneme" && D && !D.sonuc) {
    if (idx >= 0) { D.cev[D.i] = idx; ciz(); }
    else if (e.key === "ArrowRight" && D.i + 1 < D.liste.length) { D.i++; ciz(); }
    else if (e.key === "ArrowLeft" && D.i > 0) { D.i--; ciz(); }
  }
});

/* ===================== BAŞLAT ===================== */
const ilk = (location.hash || "").slice(1);
aktif = SEKME.some(s => s[0] === ilk) ? ilk : "panel";
pomoGuncelle();
ciz();
</script>
